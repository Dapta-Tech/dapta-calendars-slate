# Slate — production self-host smoke test.
#
# Builds and runs the SAME deployment-agnostic images that ship to EKS, wired to
# a local Postgres — the "does the whole thing come up on any Docker host?"
# check. This is what an OSS adopter self-hosting Slate would run; it proves the
# images are not EKS-specific.
#
#   docker compose -f docker-compose.prod.yml up --build
#   # → http://localhost:3000 (web)   http://localhost:4000/health (api)
#
# `docker-compose.yml` (the other file) is the zero-app dev-Postgres helper for
# `pnpm dev:pg`. THIS file runs the built API + web images end-to-end.
#
# Migrations run once via the `migrate` one-shot service before the API starts
# (mirrors the gated release step in deploy/DEPLOY-INTERNAL.md — never baked
# into the long-running pod, so scaling never races migrators).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-slate}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER:-slate}" -d "$${POSTGRES_DB:-slate}"']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - slate-prod-pgdata:/var/lib/postgresql/data

  # One-shot: run DB migrations, then exit. Uses the API image (it carries
  # @slate/db + the migrations).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # The api image is a PRUNED single-package bundle (no monorepo root, so no
    # root `db:migrate` script). Run the @slate/db migrate CLI via the tsx JS
    # entrypoint EXACTLY like the API's CMD: the distroless image has no shell,
    # so its node entrypoint cannot exec the node_modules/.bin/tsx shell shim —
    # only a .mjs/.js file. (--tsconfig mirrors the CMD; the dev tsconfig's
    # extends chain doesn't resolve inside the pruned bundle.)
    command:
      [
        'node_modules/tsx/dist/cli.mjs',
        '--tsconfig',
        'tsconfig.runtime.json',
        'node_modules/@slate/db/src/cli/migrate.ts',
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # The committed build ships two auth providers: `local` (an
      # unauthenticated DEV STUB) and `workos` (needs the private overlay).
      # The API deliberately REFUSES the stub under NODE_ENV=production, so
      # this smoke-test stack runs NODE_ENV=development by default — override
      # both vars together for a real deployment with a real provider:
      #   NODE_ENV=production AUTH_PROVIDER=workos (+ its JWT_SECRET etc.)
      NODE_ENV: ${NODE_ENV:-development}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      API_PORT: '4000'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      # Community-safe default: no external email, no Dapta coupling.
      EMAIL_PROVIDER: log-only
    ports:
      - '4000:4000'
    # Ready means the API answers and its database is up. The image is
    # distroless (no shell, curl or wget), so the probe is its own node binary.
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined at build time, client and server code alike: the web
        # server's API address when API_URL is unset. No browser code calls
        # the API directly.
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      NODE_ENV: production
      PORT: '3000'
      # The web server (pages rendered on the server, server actions, sign-in)
      # calls the API at API_URL, read at runtime. Inside this container
      # `localhost` is the web itself, so it names the API's service on this
      # network. A runtime NEXT_PUBLIC_API_URL would do nothing: the build arg
      # above is already inlined.
      API_URL: http://api:4000
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  slate-prod-pgdata:
