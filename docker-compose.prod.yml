# Slate — production self-host smoke test.
#
# Builds and runs the SAME deployment-agnostic images that ship to EKS, wired to
# a local Postgres — the "does the whole thing come up on any Docker host?"
# check. This is what an OSS adopter self-hosting Slate would run; it proves the
# images are not EKS-specific.
#
#   docker compose -f docker-compose.prod.yml up --build
#   # → http://localhost:3000 (web)   http://localhost:4000/health (api)
#
# `docker-compose.yml` (the other file) is the zero-app dev-Postgres helper for
# `pnpm dev:pg`. THIS file runs the built API + web images end-to-end.
#
# Migrations run once via the `migrate` one-shot service before the API starts
# (mirrors the gated release step in deploy/DEPLOY-INTERNAL.md — never baked
# into the long-running pod, so scaling never races migrators).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-slate}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER:-slate}" -d "$${POSTGRES_DB:-slate}"']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - slate-prod-pgdata:/var/lib/postgresql/data

  # One-shot: run DB migrations, then exit. Uses the API image (it carries
  # @slate/db + the migrations).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # The api image is a PRUNED single-package bundle (no monorepo root, so no
    # root `db:migrate` script). Run the @slate/db migrate CLI directly via the
    # tsx that ships as an @slate/api runtime dep. (Confirm the db `migrations/`
    # dir is present in the pruned bundle during the docker smoke test; fallback
    # = run migrations from the build stage — see deploy/DEPLOY-INTERNAL.md §6.)
    command:
      ['node_modules/.bin/tsx', 'node_modules/@slate/db/src/cli/migrate.ts']
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: '4000'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      # Community-safe default: no external email, no Dapta coupling.
      EMAIL_PROVIDER: log-only
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined into the client bundle at build time (see the web Dockerfile).
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      NODE_ENV: production
      PORT: '3000'
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  slate-prod-pgdata:
