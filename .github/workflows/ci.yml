name: CI

# Public, generic CI — nothing Dapta-internal. A contributor's fork runs this
# green with zero secrets. Internal deployment lives in the private deploy/
# overlay, never here.

on:
  # develop too: without it the merged develop head is first tested on the
  # develop-to-main release PR, long after the merge that broke it.
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  # A new push to a PR replaces its old run. Each push to develop or main gets
  # a group of its own (branch plus sha), so a quick train of merges neither
  # cancels nor queues behind another and every merged head keeps its verdict.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint · Typecheck · Test (SQLite) · Build
    runs-on: ubuntu-latest
    # Every job's limit is three to five times its slowest recent green run (a
    # few minutes at least), so a hung step fails in minutes instead of after
    # GitHub's 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: `changeset status` diffs against `baseBranch` (main).
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Reads and validates every changeset, so a malformed one or one that
      # mixes ignored and versioned packages fails here. It does not ask a PR
      # for a new changeset. git resolves `main` only as a local branch, which
      # a pull_request or develop checkout does not have, so create it from
      # origin first (fetch-depth 0 fetched origin/main).
      - name: Changesets are valid
        run: |
          git rev-parse --verify --quiet refs/heads/main >/dev/null || git branch main origin/main
          pnpm exec changeset status
      - run: pnpm glyph-gate
      - run: pnpm spacing-gate
      - run: pnpm build:packages
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  postgres:
    name: Test on Postgres (source of truth — EXCLUDE / double-booking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slate
          POSTGRES_PASSWORD: slate
          POSTGRES_DB: slate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://slate:slate@localhost:5432/slate
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Migrate + seed on Postgres
        run: pnpm db:migrate && pnpm db:seed
      - name: Booking + double-booking on real Postgres (EXCLUDE constraint)
        # repository.pg.spec.ts runs against DATABASE_URL: it books, rejects the
        # double-book (app-level + EXCLUDE), and directly asserts the
        # booking_no_overlap GiST constraint raises 23P01 on an overlap. This is
        # the tested truth — Postgres is what we trust.
        run: pnpm --filter @slate/db test
        env:
          DATABASE_URL: postgres://slate:slate@localhost:5432/slate

  e2e:
    name: Browser suite (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, postgres]
    services:
      postgres:
        # Started on the Postgres leg only: an empty image skips the service, so
        # the SQLite leg does not wait on a database it never opens.
        image: ${{ matrix.engine == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: slate
          POSTGRES_PASSWORD: slate
          POSTGRES_DB: slate_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Empty on the SQLite leg: the suite then makes a fresh SQLite file.
      E2E_DATABASE_URL: ${{ matrix.engine == 'postgres' && 'postgres://slate:slate@localhost:5432/slate_e2e' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter @slate/web exec playwright install --with-deps chromium
      # The real web build and API process, a stand-in calendar backend, both
      # canvases (1440 and 360), then the server checks. See apps/web/e2e.
      # A step timeout counts as a failure, so the upload below still runs; a
      # job timeout cancels the job and skips it, losing the report and traces.
      - run: pnpm --filter @slate/web e2e
        timeout-minutes: 15
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.engine }}
          path: |
            apps/web/e2e/.report
            apps/web/e2e/.results
            apps/web/e2e/.results-logs
            .data/e2e.db
            .data/e2e.db-wal
            .data/e2e.db-shm
          # Every one of these lives under a dot-directory, which the action
          # skips by default: without this a failing run uploaded nothing.
          include-hidden-files: true
          retention-days: 7

  compose:
    name: Self-host compose (production images)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Throwaway password for a database that lives only inside this job.
      POSTGRES_PASSWORD: slate
    steps:
      - uses: actions/checkout@v7
      # Assembled here rather than written out, so the publish gate's secret
      # scan has no credential-shaped URL to flag in this file.
      - name: Point the stack at its own database
        run: echo "DATABASE_URL=postgres://slate:${POSTGRES_PASSWORD}@db:5432/slate" >> "$GITHUB_ENV"
      # SELF-HOSTING.md's quickstart, as written: both images built from this
      # tree, migrations in the one-shot service, the web started once the
      # API's healthcheck passes.
      # A step timeout fails the step, so the logs step below still runs; a job
      # timeout would cancel the job and skip it.
      - name: Build and start docker-compose.prod.yml
        timeout-minutes: 8
        run: docker compose -f docker-compose.prod.yml up -d --build
      - name: Seed the demo account
        timeout-minutes: 3
        run: >-
          docker compose -f docker-compose.prod.yml run --rm --no-deps migrate
          node_modules/tsx/dist/cli.mjs --tsconfig tsconfig.runtime.json
          node_modules/@slate/db/src/cli/seed.ts
      # Both pages are rendered on the web server, so both prove the web
      # container reaches the API (API_URL), not only that it is up.
      - name: A booking page and a dashboard page render
        timeout-minutes: 5
        run: |
          set -euo pipefail
          base=http://localhost:3000
          page="$(curl -fsS --max-time 20 --retry 10 --retry-all-errors --retry-delay 2 "$base/acme/alex-rivera/intro-call")"
          grep -q '<title>Intro Call with Alex Rivera</title>' <<<"$page" \
            || { echo "::error::the booking page did not render the event"; head -c 2000 <<<"$page"; exit 1; }
          # The cookie the local dev sign-in sets for the seeded owner, under its
          # production name (`__Host-`, lib/session.ts). It is unsigned because
          # this stack sets no WEB_SESSION_SECRET.
          session="$(printf '{"provider":"local","email":"alex@example.com"}' | base64 -w0 | tr '+/' '-_' | tr -d '=')"
          code="$(curl -sS --max-time 20 -o admin.html -w '%{http_code}' -H "Cookie: __Host-slate_session=$session" "$base/admin/event-types")"
          # The event's public path is in the list only, never in the admin copy,
          # so this fails if the list did not render (an error under a 200).
          { test "$code" = 200 && grep -q 'alex-rivera/intro-call' admin.html; } \
            || { echo "::error::the event types page answered $code without the event list"; head -c 2000 admin.html; exit 1; }
      - if: failure() || cancelled()
        run: |
          docker compose -f docker-compose.prod.yml ps -a
          docker inspect --format '{{json .State.Health}}' "$(docker compose -f docker-compose.prod.yml ps -aq api)" || true
          docker compose -f docker-compose.prod.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  publish-gate:
    name: Publish gate (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install scanners
        # Pinned, checksum-verified, and deliberately NOT tolerant of failure.
        # The previous version of this step piped an installer URL that now
        # 404s and hid the error behind `|| true`, so gitleaks never installed
        # and the gate printed "not installed — skipped locally (runs in CI)"
        # on every run: one of its three layers dead, reported as if it were fine.
        #
        # `set -euo pipefail` is load-bearing, not decoration. A run: block's
        # default shell is `bash -e` WITHOUT pipefail, so `curl … | sh` reports
        # only sh's status: a failed download hands sh an empty script, sh exits
        # 0, and the install silently no-ops. Dropping `|| true` does nothing on
        # its own — that is the precise shape of the bug this step is fixing.
        #
        # Both versions are pinned by hand, and Dependabot will NOT bump them:
        # its github-actions ecosystem only updates `uses:` refs, not versions
        # in a run-step env block. Raise them deliberately when upgrading a
        # scanner, and re-check publish-gate.sh's trufflehog JSON parsing if the
        # trufflehog major changes.
        env:
          GITLEAKS_VERSION: 8.30.1
          TRUFFLEHOG_VERSION: 3.97.4
        run: |
          set -euo pipefail
          retry=(--retry 3 --retry-delay 2 --retry-all-errors)
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tmp="$(mktemp -d)"
          curl -sSfL "${retry[@]}" -o "$tmp/$tgz" "$base/$tgz"
          curl -sSfL "${retry[@]}" -o "$tmp/checksums.txt" \
            "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # The installer this replaced sha256-verified its download; keep that.
          # Same origin, so this catches a corrupt or tampered CDN response, not
          # a compromised release — but it is the bar for a scanner's installer.
          (cd "$tmp" && sha256sum --ignore-missing -c checksums.txt)
          tar -xzf "$tmp/$tgz" -C /usr/local/bin gitleaks
          rm -rf "$tmp"
          curl -sSfL "${retry[@]}" \
            https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin "v${TRUFFLEHOG_VERSION}"
          gitleaks version
          trufflehog --version
      - name: Run publish gate
        # Belt and braces: even if an install silently regresses again, the gate
        # itself refuses to pass with a layer missing.
        env:
          PUBLISH_GATE_REQUIRE_SCANNERS: '1'
        run: bash scripts/publish-gate.sh
